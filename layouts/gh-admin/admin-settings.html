{{ define "main" }}
{{- $gh := partial "gh-admin/settings.html" . | transform.Unmarshal }}
<h1 class="page-title">設定</h1>
<nav class="admin-nav" aria-label="管理メニュー">
  <a href="{{ $gh.adminURL }}"{{ if eq .Layout "admin" }} aria-current="page"{{ end }}>記事</a>
  <a href="{{ $gh.adminImagesURL }}"{{ if eq .Layout "admin-images" }} aria-current="page"{{ end }}>画像</a>
  <a href="{{ "admin/settings/" | relURL }}"{{ if eq .Layout "admin-settings" }} aria-current="page"{{ end }}>設定</a>
</nav>

<section class="settings-card admin-settings-card">
  <h2>GitHub認証</h2>
  <form id="admin-settings-auth-form" class="login-form" hidden>
    <label class="field">Personal access token
      <input id="admin-settings-token" type="password" autocomplete="off" placeholder="Personal access token">
    </label>
    <button class="btn" type="submit">接続</button>
  </form>
  <p id="admin-settings-auth-status" class="bulk-status" role="status"></p>
</section>

<form id="admin-settings-settings-form" class="settings-card admin-settings-card" hidden>
  <h2>サイト設定</h2>
  <label class="field">ブログ名
    <input id="admin-settings-title" type="text" maxlength="100" required>
  </label>
  <label class="field">ファビコン
    <input id="admin-settings-favicon" type="file" accept=".ico,.png,.svg,image/x-icon,image/png,image/svg+xml">
  </label>
  <div class="admin-settings-icon-preview">
    <img id="admin-settings-icon-preview" alt="現在のファビコン" hidden>
    <span id="admin-settings-icon-path" class="admin-note"></span>
  </div>

  <h2>記事カード</h2>
  <label class="field">デフォルトサムネイル
    <input id="admin-settings-thumbnail" type="file" accept=".png,.jpg,.jpeg,.webp,.gif,.svg,image/png,image/jpeg,image/webp,image/gif,image/svg+xml">
  </label>
  <div class="admin-settings-icon-preview admin-settings-thumbnail-preview">
    <img id="admin-settings-thumbnail-preview" alt="現在のデフォルトサムネイル" hidden>
    <span id="admin-settings-thumbnail-path" class="admin-note"></span>
  </div>
  <label class="field admin-settings-checkbox">
    <input id="admin-settings-clear-thumbnail" type="checkbox">
    デフォルトサムネイルを解除する
  </label>

  <button class="btn primary" type="submit">変更を保存</button>
</form>
<p id="admin-settings-status" class="bulk-status" role="status"></p>

<script type="application/json" id="admin-settings-config">{{ dict "repo" $gh.siteRepo "branch" $gh.siteBranch "path" $gh.siteConfigPath | jsonify | safeJS }}</script>
{{ end }}

{{ define "scripts" }}
<script type="module" src="{{ "gh-admin/js/admin-settings.js" | relURL }}?v=20261110-3"></script>
{{ end }}

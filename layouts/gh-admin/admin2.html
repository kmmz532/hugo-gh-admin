{{ define "main" }}
{{- $gh := partial "gh-admin/settings.html" . | transform.Unmarshal }}
<h1 class="page-title">設定</h1>

<section class="settings-card admin2-card">
  <h2>GitHub認証</h2>
  <p class="admin-note">リポジトリ <code>{{ $gh.siteRepo }}</code> の Contents に書き込む権限が必要です。</p>
  <form id="admin2-auth-form" class="login-form" hidden>
    <label class="field">Personal access token
      <input id="admin2-token" type="password" autocomplete="off" placeholder="Personal access token">
    </label>
    <button class="btn" type="submit">接続</button>
  </form>
  <p id="admin2-auth-status" class="bulk-status" role="status"></p>
</section>

<form id="admin2-settings-form" class="settings-card admin2-card" hidden>
  <h2>サイト設定</h2>
  <label class="field">ブログ名
    <input id="admin2-title" type="text" maxlength="100" required>
  </label>
  <label class="field">ファビコン
    <input id="admin2-favicon" type="file" accept=".ico,.png,.svg,image/x-icon,image/png,image/svg+xml">
  </label>
  <div class="admin2-icon-preview">
    <img id="admin2-icon-preview" alt="現在のファビコン" hidden>
    <span id="admin2-icon-path" class="admin-note"></span>
  </div>

  <h2>記事カード</h2>
  <label class="field">デフォルトサムネイル
    <input id="admin2-thumbnail" type="file" accept=".png,.jpg,.jpeg,.webp,.gif,.svg,image/png,image/jpeg,image/webp,image/gif,image/svg+xml">
  </label>
  <div class="admin2-icon-preview admin2-thumbnail-preview">
    <img id="admin2-thumbnail-preview" alt="現在のデフォルトサムネイル" hidden>
    <span id="admin2-thumbnail-path" class="admin-note"></span>
  </div>
  <label class="field">
    <input id="admin2-clear-thumbnail" type="checkbox">
    デフォルトサムネイルを解除する
  </label>

  <button class="btn primary" type="submit">変更を保存</button>
</form>
<p id="admin2-status" class="bulk-status" role="status"></p>

<script type="application/json" id="admin2-config">{{ dict "repo" $gh.siteRepo "branch" $gh.siteBranch "path" $gh.siteConfigPath | jsonify | safeJS }}</script>
{{ end }}

{{ define "scripts" }}
<script type="module" src="{{ "gh-admin/js/admin2.js" | relURL }}"></script>
{{ end }}

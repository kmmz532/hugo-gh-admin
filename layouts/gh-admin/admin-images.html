{{ define "main" }}
{{- $gh := partial "gh-admin/settings.html" . | transform.Unmarshal }}
{{- $i18n := partial "gh-admin/i18n.html" . | transform.Unmarshal }}
<h1 class="page-title">{{ $i18n.title.admin_images }}</h1>
<nav class="admin-nav" aria-label="管理メニュー">
  <a href="{{ $gh.adminURL }}"{{ if eq .Layout "admin" }} aria-current="page"{{ end }}>記事</a>
  <a href="{{ $gh.adminImagesURL }}"{{ if eq .Layout "admin-images" }} aria-current="page"{{ end }}>画像</a>
  <a href="{{ "admin/settings/" | relURL }}"{{ if eq .Layout "admin-settings" }} aria-current="page"{{ end }}>設定</a>
</nav>
<p class="admin-note">{{ $i18n.images.note }}</p>

<div id="image-manager" class="image-manager"></div>
<script type="application/json" id="gh-admin-messages">{{ partial "gh-admin/messages.html" $i18n | safeJS }}</script>
{{ end }}


{{ define "scripts" }}
<script type="module" src="{{ "gh-admin/js/admin-images.js" | relURL }}"></script>
{{ end }}
